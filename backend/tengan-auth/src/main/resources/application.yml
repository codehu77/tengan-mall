server:
  port: 9010

spring:
  application:
    name: tengan-mall-auth
  datasource:
    url: jdbc:mysql://localhost:3306/tengan_mall_auth?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Taipei
    username: root
    password: ${MYSQL_ROOT_PASSWORD:tengan123}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:tengan123}
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER:tengan}
    password: ${RABBITMQ_PASSWORD:tengan123}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_ADMIN_USERNAME:nacos}
        password: ${NACOS_ADMIN_PASSWORD:tengan123}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_ADMIN_USERNAME:nacos}
        password: ${NACOS_ADMIN_PASSWORD:tengan123}
        file-extension: yaml
  config:
    import: optional:nacos:${spring.application.name}.yaml

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:293677465630-rcoba1j2ltrl9d5apllvfqealb4lbp9p.apps.googleusercontent.com}

# app-id 跟上面 Google client-id 一樣不是機密（前端本來就會送進頁面 JS），可以給預設值。
# app-secret 是真正的機密，刻意不給預設值——本機開發要在 IntelliJ 的 tengan-auth Run Configuration
# 加 FACEBOOK_OAUTH_APP_SECRET 這個 env var，沒設時 Facebook 登入會固定驗證失敗，不影響其他功能開機。
facebook:
  oauth:
    app-id: ${FACEBOOK_OAUTH_APP_ID:961854950273183}
    app-secret: ${FACEBOOK_OAUTH_APP_SECRET:}
