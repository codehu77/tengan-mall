<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>tengan-devtools · MOMO 商品匯入</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft JhengHei", system-ui, sans-serif; margin: 0; padding: 24px; background: #f4f5f7; color: #222; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .hint { color: #777; font-size: 13px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
  .steps { display: flex; gap: 8px; margin-bottom: 20px; }
  .step { padding: 6px 14px; border-radius: 999px; background: #e5e7eb; color: #666; font-size: 13px; }
  .step.active { background: #2563eb; color: #fff; }
  label { display: block; font-size: 13px; color: #444; margin: 12px 0 4px; }
  input[type=text], input[type=url], input[type=number], select, textarea {
    width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
  }
  textarea { min-height: 80px; }
  button { cursor: pointer; border: none; border-radius: 4px; padding: 9px 18px; font-size: 14px; background: #2563eb; color: #fff; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  button.secondary { background: #e5e7eb; color: #333; }
  .row { display: flex; gap: 24px; }
  .row > div { flex: 1; }
  .thumb-grid { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; }
  .thumb { border: 2px solid transparent; border-radius: 4px; padding: 4px; text-align: center; width: 120px; }
  .thumb.excluded { opacity: .35; }
  .thumb img { width: 100%; height: 90px; object-fit: contain; background: #fafafa; }
  .thumb label { margin: 4px 0 0; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0; }
  th, td { border-bottom: 1px solid #eee; padding: 6px 8px; font-size: 13px; text-align: left; vertical-align: middle; }
  th { color: #666; font-weight: 600; }
  .sku-img { width: 48px; height: 48px; object-fit: contain; background: #fafafa; border: 1px solid #eee; }
  .cat-chain select { margin-bottom: 8px; }
  .error { background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; padding: 10px 14px; border-radius: 4px; margin: 12px 0; white-space: pre-wrap; }
  .success { background: #f0fdf4; border: 1px solid #86efac; color: #166534; padding: 14px; border-radius: 4px; }
  .muted { color: #888; font-size: 12px; }
  .actions { display: flex; justify-content: space-between; margin-top: 20px; }
  .spec-hints { font-size: 12px; color: #666; }
  .spec-hints span { display: inline-block; background: #f3f4f6; border-radius: 3px; padding: 2px 6px; margin: 2px; }
</style>
</head>
<body>

<h1>tengan-devtools · MOMO 商品匯入</h1>
<div class="hint">內部一次性小工具：貼 MOMO 商品網址抓 demo 資料，分類/品牌/規格屬性一律手動選現有的。</div>

<div class="steps">
  <div class="step" id="step-indicator-1">1. 抓取</div>
  <div class="step" id="step-indicator-2">2. 分類與屬性</div>
  <div class="step" id="step-indicator-3">3. 預覽送出</div>
  <span style="flex:1"></span>
  <button class="secondary" id="btn-cancel-import">取消，重新開始</button>
</div>

<div id="app"></div>

<script>
const state = {
  scrape: null,
  spuImages: [],       // [{url, included}]
  mainImageUrl: null,  // spuImages 其中一張的 url，勾選匯入的圖才能被選為主圖
  featureImages: [],   // [{url, included}]
  featureText: '',
  name: '',
  skuRows: [],          // [{included, name, price, imageUrl}]
  categories: [],
  brands: [],
  categoryId: null,
  brandId: null,
  baseAttrs: [],
  saleAttrs: [],
  baseAttrValues: {},   // attrId -> value
  selectedSaleAttrIds: [],  // 可複選，例如同時套用「顏色」+「容量」
  skuAttrValues: {},        // rowIndex -> { attrId: value }
  skuAttrManualEdits: {},   // rowIndex -> Set<attrId>，記錄哪些格子被使用者手動改過，自動拆值不能覆蓋
};

function escapeHtml(s) {
  return (s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  let json = null;
  try { json = text ? JSON.parse(text) : null; } catch (e) { /* not JSON */ }
  if (!res.ok) {
    throw new Error((json && json.message) ? json.message : (text || ('HTTP ' + res.status)));
  }
  return json;
}

function setActiveStep(n) {
  [1,2,3].forEach(i => {
    document.getElementById('step-indicator-' + i).classList.toggle('active', i === n);
  });
}

const app = document.getElementById('app');

/** 匯入成功後想抓下一個商品，不能只是回 step1——上一輪的分類/屬性/SKU 狀態都要清乾淨，
 * 不然新商品會殘留上一個商品選過的分類或屬性值。 */
function resetState() {
  state.scrape = null;
  state.spuImages = [];
  state.mainImageUrl = null;
  state.featureImages = [];
  state.featureText = '';
  state.name = '';
  state.skuRows = [];
  state.categories = [];
  state.brands = [];
  state.categoryId = null;
  state.brandId = null;
  state.baseAttrs = [];
  state.saleAttrs = [];
  state.baseAttrValues = {};
  state.selectedSaleAttrIds = [];
  state.skuAttrValues = {};
  state.skuAttrManualEdits = {};
  state.lastUrl = '';
  renderStep1();
}

function renderStep1() {
  setActiveStep(1);
  app.innerHTML = `
    <div class="card">
      <label>MOMO 商品網址</label>
      <input type="url" id="momo-url" placeholder="https://www.momoshop.com.tw/product/xxxxxxxx" value="${escapeHtml(state.lastUrl || '')}">
      <div class="actions">
        <span></span>
        <button id="btn-scrape">抓取</button>
      </div>
      <div id="scrape-status"></div>
    </div>
    <div id="scrape-preview"></div>
  `;
  document.getElementById('btn-scrape').addEventListener('click', onScrape);
}

async function onScrape() {
  const url = document.getElementById('momo-url').value.trim();
  const statusEl = document.getElementById('scrape-status');
  if (!url) { statusEl.innerHTML = '<div class="error">請先貼網址</div>'; return; }
  state.lastUrl = url;
  statusEl.innerHTML = '<div class="muted">抓取中，實際開瀏覽器渲染 MOMO 頁面，可能要 10~20 秒…</div>';
  document.getElementById('btn-scrape').disabled = true;
  try {
    const result = await api('POST', '/api/scrape', { url });
    state.scrape = result;
    state.name = result.name || '';
    state.featureText = result.featureText || '';
    state.spuImages = (result.spuImages || []).map(u => ({ url: u, included: true }));
    state.mainImageUrl = state.spuImages.length > 0 ? state.spuImages[0].url : null;
    state.featureImages = (result.featureImages || []).map(u => ({ url: u, included: true }));
    state.skuRows = (result.skus || []).map(s => ({
      included: true, name: s.name || '', price: s.price ?? '', imageUrl: s.mainImage || '',
    }));
    statusEl.innerHTML = '';
    renderScrapePreview();
  } catch (e) {
    statusEl.innerHTML = `<div class="error">抓取失敗：${escapeHtml(e.message)}</div>`;
  } finally {
    document.getElementById('btn-scrape').disabled = false;
  }
}

function specHintsHtml() {
  const hints = (state.scrape && state.scrape.specHints) || [];
  return hints.map(h => `<span>${escapeHtml(h.name)}：${escapeHtml(h.value)}</span>`).join('') || '<span class="muted">無</span>';
}

function renderScrapePreview() {
  document.getElementById('scrape-preview').innerHTML = `
    <div class="card">
      <label>商品名稱</label>
      <input type="text" id="spu-name" value="${escapeHtml(state.name)}">

      <label>MOMO 規格提示（僅供參考，不會自動套用）</label>
      <div class="spec-hints">${specHintsHtml()}</div>

      <label>SPU 圖片（取消勾選＝不匯入；勾「主圖」決定商品主要展示圖，預設第一張）</label>
      <div class="thumb-grid" id="spu-image-grid"></div>

      <label>商品特色文字</label>
      <textarea id="feature-text">${escapeHtml(state.featureText)}</textarea>

      <label>商品特色圖片（取消勾選＝不匯入）</label>
      <div class="thumb-grid" id="feature-image-grid"></div>

      <label>SKU（顏色/規格）</label>
      <table id="sku-table">
        <thead><tr><th></th><th>圖片</th><th>名稱</th><th>價格</th></tr></thead>
        <tbody></tbody>
      </table>

      <div class="actions">
        <button class="secondary" id="btn-back-1">重新抓取</button>
        <button id="btn-to-step2">下一步：選分類/品牌/屬性</button>
      </div>
    </div>
  `;

  renderSpuImageGrid();
  renderThumbGrid('feature-image-grid', state.featureImages);
  renderSkuTable();

  document.getElementById('spu-name').addEventListener('input', e => state.name = e.target.value);
  document.getElementById('feature-text').addEventListener('input', e => state.featureText = e.target.value);
  document.getElementById('btn-back-1').addEventListener('click', renderStep1);
  document.getElementById('btn-to-step2').addEventListener('click', onNextToStep2);
}

/** SPU 圖片跟商品特色圖片共用同一套「勾選匯入」邏輯，但 SPU 圖片還要多一個「設為主圖」單選——
 * 兩者夠不一樣，另外寫一個專用的 render 函式，不硬塞進 renderThumbGrid 的共用邏輯裡。 */
function renderSpuImageGrid() {
  const el = document.getElementById('spu-image-grid');
  el.innerHTML = state.spuImages.map((img, i) => `
    <div class="thumb ${img.included ? '' : 'excluded'}" data-idx="${i}">
      <img src="${escapeHtml(img.url)}" loading="lazy">
      <label><input type="checkbox" ${img.included ? 'checked' : ''} data-role="include"> 匯入</label>
      <label><input type="radio" name="spu-main-image" ${state.mainImageUrl === img.url ? 'checked' : ''} ${img.included ? '' : 'disabled'} data-role="main"> 主圖</label>
    </div>
  `).join('');
  el.querySelectorAll('.thumb').forEach(thumbEl => {
    const idx = Number(thumbEl.dataset.idx);
    thumbEl.querySelector('[data-role=include]').addEventListener('change', e => {
      const img = state.spuImages[idx];
      img.included = e.target.checked;
      // 取消勾選匯入的圖片不能繼續當主圖，改退回第一張還有勾選匯入的圖
      if (!img.included && state.mainImageUrl === img.url) {
        const fallback = state.spuImages.find(i => i.included);
        state.mainImageUrl = fallback ? fallback.url : null;
      }
      renderSpuImageGrid();
    });
    thumbEl.querySelector('[data-role=main]').addEventListener('change', e => {
      if (e.target.checked) state.mainImageUrl = state.spuImages[idx].url;
    });
  });
}

function renderThumbGrid(containerId, images) {
  const el = document.getElementById(containerId);
  el.innerHTML = images.map((img, i) => `
    <div class="thumb ${img.included ? '' : 'excluded'}" data-idx="${i}">
      <img src="${escapeHtml(img.url)}" loading="lazy">
      <label><input type="checkbox" ${img.included ? 'checked' : ''} data-role="include"> 匯入</label>
    </div>
  `).join('');
  el.querySelectorAll('.thumb').forEach(thumbEl => {
    const idx = Number(thumbEl.dataset.idx);
    thumbEl.querySelector('[data-role=include]').addEventListener('change', e => {
      images[idx].included = e.target.checked;
      thumbEl.classList.toggle('excluded', !e.target.checked);
    });
  });
}

function renderSkuTable() {
  const tbody = document.querySelector('#sku-table tbody');
  tbody.innerHTML = state.skuRows.map((row, i) => `
    <tr data-idx="${i}">
      <td><input type="checkbox" data-role="include" ${row.included ? 'checked' : ''}></td>
      <td>${row.imageUrl ? `<img class="sku-img" src="${escapeHtml(row.imageUrl)}">` : ''}</td>
      <td><input type="text" data-role="name" value="${escapeHtml(row.name)}"></td>
      <td><input type="number" step="1" data-role="price" value="${escapeHtml(String(row.price))}"></td>
    </tr>
  `).join('');
  tbody.querySelectorAll('tr').forEach(tr => {
    const idx = Number(tr.dataset.idx);
    tr.querySelector('[data-role=include]').addEventListener('change', e => state.skuRows[idx].included = e.target.checked);
    tr.querySelector('[data-role=name]').addEventListener('input', e => state.skuRows[idx].name = e.target.value);
    tr.querySelector('[data-role=price]').addEventListener('input', e => state.skuRows[idx].price = e.target.value);
  });
}

async function onNextToStep2() {
  if (state.skuRows.filter(r => r.included).length === 0) {
    alert('至少要保留一個 SKU');
    return;
  }
  try {
    const [categories, brands] = await Promise.all([
      api('GET', '/api/categories'),
      api('GET', '/api/brands'),
    ]);
    state.categories = categories.items || [];
    state.brands = brands.items || [];
    // 不在這裡重置 categoryId/baseAttrs/saleAttrs——如果是從 Step1「上一步」繞回來再點
    // 「下一步」，之前選好的分類/屬性都還在 state 裡，要交給 renderCategoryChain() 判斷
    // 是要還原還是重新選。真的要清空重來的時機只有 resetState()（匯入下一個商品）。
    renderStep2();
  } catch (e) {
    alert('讀取分類/品牌失敗：' + e.message);
  }
}

function renderStep2() {
  setActiveStep(2);
  app.innerHTML = `
    <div class="card">
      <label>商品名稱（來自 Step1，僅供參考）</label>
      <div class="muted" style="margin-bottom:8px;">${escapeHtml(state.name)}</div>

      <label>MOMO 規格提示（僅供參考，不會自動套用）</label>
      <div class="spec-hints" style="margin-bottom:8px;">${specHintsHtml()}</div>

      <div class="row">
        <div>
          <label>分類（選到底層）</label>
          <div class="cat-chain" id="cat-chain"></div>
        </div>
        <div>
          <label>品牌</label>
          <select id="brand-select">
            <option value="">-- 選擇品牌 --</option>
            ${state.brands.map(b => `<option value="${b.id}" ${state.brandId === b.id ? 'selected' : ''}>${escapeHtml(b.name)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div id="attrs-section"></div>
      <div class="actions">
        <button class="secondary" id="btn-back-2">上一步</button>
        <button id="btn-to-step3" disabled>下一步：預覽送出</button>
      </div>
    </div>
  `;
  document.getElementById('brand-select').addEventListener('change', e => {
    state.brandId = e.target.value ? Number(e.target.value) : null;
    updateStep2NextEnabled();
  });
  // renderScrapePreview() 只負責把內容塞進 #scrape-preview，這個容器只存在於 Step1 的外殼裡；
  // Step2 進來時已經把整個 app.innerHTML 換掉了，要先呼叫 renderStep1() 重建外殼才能再填內容，
  // 不然 renderScrapePreview() 抓不到 #scrape-preview 會直接丟例外、畫面沒反應。
  document.getElementById('btn-back-2').addEventListener('click', () => {
    renderStep1();
    renderScrapePreview();
  });
  document.getElementById('btn-to-step3').addEventListener('click', onNextToStep3);
  renderCategoryChain();
}

/** 從根節點反查到目標葉節點的路徑（含根節點本身），找不到回傳 null。
 * 用來在「上一步/下一步」繞回 Step2 時，把已經選過的分類鏈還原成畫面上的樣子——
 * state 只記葉節點的 categoryId，沒有記每一層選了誰，所以要對已經拿到手的分類樹反查。 */
function findCategoryPath(nodes, targetId) {
  for (const node of nodes) {
    if (node.id === targetId) return [node];
    if (node.children && node.children.length > 0) {
      const sub = findCategoryPath(node.children, targetId);
      if (sub) return [node, ...sub];
    }
  }
  return null;
}

function renderCategoryChain() {
  const chain = document.getElementById('cat-chain');
  chain.innerHTML = '';
  const attrsSection = document.getElementById('attrs-section');

  if (state.categoryId === null) {
    attrsSection.innerHTML = '';
    appendCategoryLevel(chain, state.categories);
    return;
  }

  // 繞回 Step2 且之前已經選過分類：屬性資料還在 state 裡，直接反查路徑還原下拉選單、
  // 重繪屬性區塊就好，不能呼叫 loadAttrsForCategory()（那支會把已經填好的屬性值洗掉）。
  const path = findCategoryPath(state.categories, state.categoryId);
  if (!path) {
    // 理論上不會發生（分類樹跟之前選的對不起來），保守起見退回重新選
    state.categoryId = null;
    attrsSection.innerHTML = '';
    appendCategoryLevel(chain, state.categories);
    return;
  }
  appendCategoryLevel(chain, state.categories, path);
  renderAttrsSection();
  updateStep2NextEnabled();
}

function appendCategoryLevel(chain, nodes, restorePath) {
  const select = document.createElement('select');
  select.innerHTML = '<option value="">-- 選擇 --</option>' +
    nodes.map(n => `<option value="${n.id}">${escapeHtml(n.name)}</option>`).join('');
  select.addEventListener('change', () => {
    // 清掉這一層之後所有已經渲染的下一層選單
    while (chain.children[Array.from(chain.children).indexOf(select) + 1]) {
      chain.removeChild(chain.lastChild);
    }
    state.categoryId = null;
    document.getElementById('attrs-section').innerHTML = '';
    updateStep2NextEnabled();

    const id = select.value;
    if (!id) return;
    const node = nodes.find(n => String(n.id) === id);
    if (node.children && node.children.length > 0) {
      appendCategoryLevel(chain, node.children);
    } else {
      state.categoryId = Number(id);
      loadAttrsForCategory(state.categoryId);
    }
  });
  chain.appendChild(select);

  // 還原之前選過的路徑：這一層直接選好，並繼續往下一層畫，不用等使用者手動再選一次。
  if (restorePath && restorePath.length > 0) {
    const [currentNode, ...rest] = restorePath;
    select.value = String(currentNode.id);
    if (currentNode.children && currentNode.children.length > 0) {
      appendCategoryLevel(chain, currentNode.children, rest);
    }
  }
}

async function loadAttrsForCategory(categoryId) {
  const section = document.getElementById('attrs-section');
  section.innerHTML = '<div class="muted">載入規格屬性中…</div>';
  try {
    const [baseAttrs, saleAttrs] = await Promise.all([
      api('GET', `/api/categories/${categoryId}/base-attrs`),
      api('GET', `/api/categories/${categoryId}/sale-attrs`),
    ]);
    state.baseAttrs = baseAttrs.items || [];
    state.saleAttrs = saleAttrs.items || [];
    state.baseAttrValues = {};
    state.selectedSaleAttrIds = [];
    state.skuAttrValues = {};
    state.skuAttrManualEdits = {};
    state.skuRows.forEach((r, idx) => { state.skuAttrValues[idx] = {}; });
    renderAttrsSection();
    updateStep2NextEnabled();
  } catch (e) {
    section.innerHTML = `<div class="error">載入規格屬性失敗：${escapeHtml(e.message)}</div>`;
  }
}

/** 勾選/取消一個銷售屬性，勾完重新跑一次自動拆值。 */
function toggleSaleAttr(attrId, checked) {
  if (checked) {
    if (!state.selectedSaleAttrIds.includes(attrId)) {
      state.selectedSaleAttrIds.push(attrId);
    }
  } else {
    state.selectedSaleAttrIds = state.selectedSaleAttrIds.filter(id => id !== attrId);
  }
  autoFillSkuAttrValues();
  renderAttrsSection();
}

/** 依目前勾選的銷售屬性維度數，把 SKU 原始名稱自動拆進對應欄位：
 * - 只勾一個維度：整段原始名稱塞進去（例如「漫遊紫 256G」全部當顏色）。
 * - 勾兩個以上維度，且名稱用空白切開後的 token 數剛好等於維度數：依「勾選的先後順序」一個 token
 *   對應一個維度——MOMO 的 SKU 命名習慣是「顏色 容量」，先勾顏色、再勾容量，第一段就會對到顏色、
 *   第二段對到容量。token 數兜不起來（名稱沒空白、或維度更多）就不猜，留給使用者自己填。
 * 每次重算都只覆蓋使用者自己還沒手動改過的格子（skuAttrManualEdits 記錄哪些格子被手動編輯過），
 * 不會蓋掉使用者自己輸入的值；也因此「顏色」先前因為只選一個維度被塞整段名稱的值，等使用者
 * 再勾第二個維度時會被這裡重新算過、自動修正成只留該維度對應的那一段。 */
function autoFillSkuAttrValues() {
  const attrIds = state.selectedSaleAttrIds;
  state.skuRows.forEach((r, idx) => {
    if (!state.skuAttrValues[idx]) state.skuAttrValues[idx] = {};
    const manualEdits = state.skuAttrManualEdits[idx];
    const values = state.skuAttrValues[idx];
    const tokens = r.name.trim().split(/\s+/).filter(Boolean);
    if (attrIds.length === 1) {
      const attrId = attrIds[0];
      if (!manualEdits || !manualEdits.has(attrId)) values[attrId] = r.name;
    } else if (attrIds.length > 1 && tokens.length === attrIds.length) {
      attrIds.forEach((attrId, i) => {
        if (!manualEdits || !manualEdits.has(attrId)) values[attrId] = tokens[i];
      });
    }
  });
}

/** 把某個 SKU 目前填的所有銷售屬性值接起來，塞進 SKU 名稱——例如「顏色」填漫遊紫、「容量」填 256G，
 * 按下去名稱就變成「漫遊紫 256G」。名稱欄位本身還是可以手動再調整，不會被之後的輸入覆蓋。 */
function combineSkuName(idx) {
  const values = state.skuAttrValues[idx] || {};
  const combined = state.selectedSaleAttrIds.map(id => values[id]).filter(v => v && v.trim() !== '').join(' ');
  if (combined) {
    state.skuRows[idx].name = combined;
    renderAttrsSection();
  }
}

function renderAttrsSection() {
  const section = document.getElementById('attrs-section');
  const includedSkus = state.skuRows.map((r, i) => ({ ...r, idx: i })).filter(r => r.included);
  const selectedAttrs = state.saleAttrs.filter(a => state.selectedSaleAttrIds.includes(a.id));

  section.innerHTML = `
    <label>規格屬性（Base Attr，選填）</label>
    ${state.baseAttrs.length === 0 ? '<div class="muted">這個分類沒有規格屬性</div>' : ''}
    ${state.baseAttrs.map(a => `
      <div style="margin-bottom:6px;">
        <span class="muted">${escapeHtml(a.name)}</span>
        <input type="text" data-base-attr="${a.id}" value="${escapeHtml(state.baseAttrValues[a.id] ?? '')}" placeholder="填 ${escapeHtml(a.name)} 的值">
      </div>
    `).join('')}

    <label>銷售屬性（Sale Attr）—— 可複選，例如同時勾「顏色」+「容量」，一個 SKU 就能同時對應兩個維度</label>
    <div>
      ${state.saleAttrs.length === 0 ? '<span class="muted">這個分類沒有銷售屬性</span>' : ''}
      ${state.saleAttrs.map(a => `
        <label style="display:inline-block; margin: 0 14px 6px 0; font-weight:normal;">
          <input type="checkbox" data-sale-attr-toggle="${a.id}" ${state.selectedSaleAttrIds.includes(a.id) ? 'checked' : ''}>
          ${escapeHtml(a.name)}
        </label>
      `).join('')}
    </div>

    <table style="margin-top:10px;">
      <thead>
        <tr>
          <th>SKU 名稱</th><th>價格</th>
          ${selectedAttrs.map(a => `<th>${escapeHtml(a.name)}</th>`).join('')}
          ${selectedAttrs.length > 1 ? '<th></th>' : ''}
        </tr>
      </thead>
      <tbody>
        ${includedSkus.map(r => `
          <tr>
            <td><input type="text" data-sku-name-idx="${r.idx}" value="${escapeHtml(r.name)}"></td>
            <td>$${escapeHtml(String(r.price))}</td>
            ${selectedAttrs.map(a => `
              <td><input type="text" data-sku-attr-idx="${r.idx}" data-sku-attr-id="${a.id}"
                value="${escapeHtml((state.skuAttrValues[r.idx] && state.skuAttrValues[r.idx][a.id]) ?? '')}"></td>
            `).join('')}
            ${selectedAttrs.length > 1 ? `<td><button type="button" class="secondary" data-combine-idx="${r.idx}">組合成名稱</button></td>` : ''}
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;

  section.querySelectorAll('[data-base-attr]').forEach(input => {
    input.addEventListener('input', e => {
      state.baseAttrValues[e.target.dataset.baseAttr] = e.target.value;
    });
  });
  section.querySelectorAll('[data-sale-attr-toggle]').forEach(checkbox => {
    checkbox.addEventListener('change', e => {
      toggleSaleAttr(Number(e.target.dataset.saleAttrToggle), e.target.checked);
    });
  });
  section.querySelectorAll('[data-sku-name-idx]').forEach(input => {
    input.addEventListener('input', e => {
      state.skuRows[e.target.dataset.skuNameIdx].name = e.target.value;
    });
  });
  section.querySelectorAll('[data-sku-attr-idx]').forEach(input => {
    input.addEventListener('input', e => {
      const idx = e.target.dataset.skuAttrIdx;
      const attrId = Number(e.target.dataset.skuAttrId);
      if (!state.skuAttrValues[idx]) state.skuAttrValues[idx] = {};
      state.skuAttrValues[idx][attrId] = e.target.value;
      // 使用者自己手動改過這格，之後再勾/取消其他銷售屬性維度時，自動拆值不能再覆蓋這格
      if (!state.skuAttrManualEdits[idx]) state.skuAttrManualEdits[idx] = new Set();
      state.skuAttrManualEdits[idx].add(attrId);
    });
  });
  section.querySelectorAll('[data-combine-idx]').forEach(button => {
    button.addEventListener('click', e => combineSkuName(Number(e.target.dataset.combineIdx)));
  });
}

function updateStep2NextEnabled() {
  const btn = document.getElementById('btn-to-step3');
  if (!btn) return;
  btn.disabled = !(state.categoryId && state.brandId);
}

function onNextToStep3() {
  renderStep3();
}

function buildImportRequest() {
  const includedSpuImages = state.spuImages.filter(i => i.included).map(i => i.url);
  const includedFeatureImages = state.featureImages.filter(i => i.included).map(i => i.url);
  // 選到的主圖如果因為取消勾選而不在匯入清單裡了，退回目前清單的第一張
  const mainImageUrl = includedSpuImages.includes(state.mainImageUrl) ? state.mainImageUrl : (includedSpuImages[0] || null);
  const baseAttrValues = Object.entries(state.baseAttrValues)
    .filter(([, v]) => v && v.trim() !== '')
    .map(([attrId, value]) => ({ attrId: Number(attrId), value }));

  const skus = state.skuRows.map((row, idx) => ({ ...row, idx })).filter(r => r.included).map(r => {
    const values = state.skuAttrValues[r.idx] || {};
    const saleAttrValues = Object.entries(values)
      .filter(([, v]) => v && String(v).trim() !== '')
      .map(([attrId, value]) => ({ attrId: Number(attrId), value }));
    return {
      name: r.name,
      price: Number(r.price),
      imageUrl: r.imageUrl || null,
      saleAttrValues,
      purchaseLimitPerUser: null,
    };
  });

  return {
    categoryId: state.categoryId,
    brandId: state.brandId,
    name: state.name,
    featureText: state.featureText || null,
    spuImageUrls: includedSpuImages,
    mainImageUrl,
    featureImageUrls: includedFeatureImages,
    baseAttrValues,
    skus,
  };
}

function renderStep3() {
  setActiveStep(3);
  const req = buildImportRequest();
  app.innerHTML = `
    <div class="card">
      <label>即將送出的資料</label>
      <pre style="white-space:pre-wrap; font-size:12px; background:#f8f9fa; padding:12px; border-radius:4px;">${escapeHtml(JSON.stringify(req, null, 2))}</pre>
      <div id="import-status"></div>
      <div class="actions">
        <button class="secondary" id="btn-back-3">上一步</button>
        <button id="btn-submit">確認匯入</button>
      </div>
    </div>
  `;
  document.getElementById('btn-back-3').addEventListener('click', renderStep2);
  document.getElementById('btn-submit').addEventListener('click', async () => {
    const statusEl = document.getElementById('import-status');
    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    statusEl.innerHTML = '<div class="muted">上傳圖片＋建立商品中…</div>';
    try {
      const result = await api('POST', '/api/import', req);
      statusEl.innerHTML = `<div class="success">建立成功！新的 SPU id = ${result.spuId}</div>`;
      document.querySelector('.actions').innerHTML = `<span></span><button id="btn-reset">匯入下一個商品</button>`;
      document.getElementById('btn-reset').addEventListener('click', resetState);
    } catch (e) {
      statusEl.innerHTML = `<div class="error">匯入失敗：${escapeHtml(e.message)}</div>`;
      btn.disabled = false;
    }
  });
}

// 「取消，重新開始」放在 steps 列外面（#app 之外），不會被任何一步的 render 函式重繪掉，
// 所以只需要在頁面載入時綁一次事件，不管卡在哪一步都按得到、都能直接砍掉重練。
document.getElementById('btn-cancel-import').addEventListener('click', () => {
  if (confirm('確定要取消嗎？目前輸入的內容都會清空，重新回到第一步。')) {
    resetState();
  }
});

renderStep1();
</script>
