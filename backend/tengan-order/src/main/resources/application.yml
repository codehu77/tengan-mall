server:
  port: 9090

spring:
  application:
    name: tengan-mall-order
  datasource:
    url: jdbc:mysql://localhost:3306/tengan_mall_order?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Taipei
    username: root
    password: ${MYSQL_ROOT_PASSWORD:tengan123}
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:tengan123}
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:tengan}
    password: ${RABBITMQ_PASSWORD:tengan123}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_ADMIN_USERNAME:nacos}
        password: ${NACOS_ADMIN_PASSWORD:tengan123}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_ADMIN_USERNAME:nacos}
        password: ${NACOS_ADMIN_PASSWORD:tengan123}
        file-extension: yaml
  config:
    import: optional:nacos:${spring.application.name}.yaml

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health

tengan:
  order:
    # 待付款訂單多久沒付款自動取消（毫秒）；正式環境建議 30 分鐘，這裡預設值方便本機直接啟動就能跑，
    # 展示/測試時建議在 Nacos tengan-mall-order.yaml 覆蓋成更短的值（例如 60000）。
    unpaid-timeout-ms: 900000
  snowflake:
    # orderSn 產生器的 worker-id，tengan-seckill 給 2，兩邊不重複避免同毫秒生出相同 ID。
    worker-id: 1
